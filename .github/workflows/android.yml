name: android-apk

# Full-offline APK: all ~37k atlas assets (img/thumb/audio/entries) are packed
# inside the APK. Heavy work runs here on GitHub-hosted runners (free for
# public repos) — nothing large ever touches a dev machine.
#
# - push to main (or this feature branch): debug APK -> Actions Artifacts
# - tag v*: signed release APK -> GitHub Release (needs keystore secrets;
#   without them the debug-signed APK is attached instead so it's still installable)
# - manual: workflow_dispatch

on:
  push:
    branches: [main, feat/capacitor-apk]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full assets, shallow history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java (Gradle needs JDK 17+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install deps
        run: npm ci

      - name: Build web assets for Capacitor (relative paths)
        run: npm run build:apk

      - name: Generate native project (android/ is gitignored by design)
        run: |
          npx cap add android
          npx cap sync android

      - name: Stamp versionName from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import re, os
          tag = os.environ.get("GITHUB_REF_NAME", "")
          ver = tag[1:] if tag.startswith("v") else tag
          p = "android/variables.gradle"
          try:
              s = open(p).read()
          except FileNotFoundError:
              print("no variables.gradle, skip")
              raise SystemExit
          ns, n = re.subn(r"(versionName\s*=\s*['\"])[^'\"]*(['\"])", rf"\g<1>{ver}\g<2>", s, count=1)
          if n:
              open(p, "w").write(ns)
              print(f"versionName -> {ver}")
          else:
              print("versionName line not found, skip")
          EOF

      - name: Assemble debug APK (always, installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wordatlas-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Inject release signing (only when keystore secrets exist)
        if: startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import base64, os
          raw = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"])
          open("android/app/wordatlas-release.jks", "wb").write(raw)
          def q(s):
              return s.replace("\\", "\\\\").replace("'", "\\'")
          ks = q(os.environ["KEYSTORE_PASSWORD"]); ka = q(os.environ["KEY_ALIAS"]); kp = q(os.environ["KEY_PASSWORD"])
          block = f"""
          android {{
              signingConfigs {{
                  release {{
                      storeFile file("wordatlas-release.jks")
                      storePassword '{ks}'
                      keyAlias '{ka}'
                      keyPassword '{kp}'
                  }}
              }}
              buildTypes {{
                  release {{
                      signingConfig signingConfigs.release
                  }}
              }}
          }}
          """
          open("android/app/build.gradle", "a").write(block)
          print("release signing injected")
          EOF

      - name: Assemble release APK (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Correctly signed release APK straight from Gradle?
          SIGNED_OK=0
          if [ -f android/app/build/outputs/apk/release/app-release.apk ] && [ -f android/app/wordatlas-release.jks ]; then
            if "$ANDROID_HOME/build-tools/"*/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk 2>/dev/null | grep -q "Signer #1"; then
              SIGNED_OK=1
            fi
          fi
          if [ "$SIGNED_OK" = "1" ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
            OUT="wordatlas-${TAG}.apk"
            NOTE="正式签名包，可直接安装。含全量离线词库（约 650MB）。"
          else
            # Fall back to the debug-signed APK so the Release stays installable.
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            OUT="wordatlas-${TAG}-debug.apk"
            NOTE="debug 签名包（可直接安装，先顶着）。要出正式签名：在仓库 Secrets 里加 ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 后重打 tag。"
          fi
          if [ ! -f "$APK" ]; then echo "APK missing: $APK"; ls -R android/app/build/outputs/apk || true; exit 1; fi
            cp "$APK" "$OUT"
            ls -lh "$OUT"
            gh release create "$TAG" "$OUT" \
              --title "词光 $TAG" \
              --notes "词光 Word Atlas Android 版（fork 自 designfuchen/word-atlas，代码 MIT，词库/插画/录音 CC BY 4.0 署名 Word Atlas contributors）。

          $NOTE

          安装：下载 apk 后直接安装（需允许「安装未知应用」）。
          体积：约 650MB，全量 7298 词插画 + 英美发音 + 例句朗读，打包进本地，断网可刷。"
          else
            echo "release APK missing"; ls -R android/app/build/outputs/apk || true; exit 1
          fi
