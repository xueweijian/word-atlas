name: android-apk

# Full-offline APK: all ~37k atlas assets (img/thumb/audio/entries) are packed
# inside the APK. Heavy work runs here on GitHub-hosted runners (free for
# public repos) — nothing large ever touches a dev machine.
#
# - push to main (or this feature branch): debug APK -> Actions Artifacts
# - tag v*: signed release APK -> GitHub Release (needs keystore secrets;
#   without them the debug-signed APK is attached instead so it's still installable)
# - manual: workflow_dispatch

on:
  push:
    branches: [main, feat/capacitor-apk]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full assets, shallow history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java (Gradle needs JDK 21+, cache gradle deps)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install deps
        run: npm ci

      - name: Unit tests (node --test + tsx, upstream runner)
        run: npm test

      - name: Build web assets for Capacitor (relative paths)
        run: npm run build:apk

      - name: Generate native project (android/ is gitignored by design)
        run: |
          npx cap add android
          npx cap sync android

      - name: Stamp versionName from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import re, os
          tag = os.environ.get("GITHUB_REF_NAME", "")
          ver = tag[1:] if tag.startswith("v") else tag
          p = "android/variables.gradle"
          try:
              s = open(p).read()
          except FileNotFoundError:
              print("no variables.gradle, skip")
              raise SystemExit
          ns, n = re.subn(r"(versionName\s*=\s*['\"])[^'\"]*(['\"])", rf"\g<1>{ver}\g<2>", s, count=1)
          if n:
              open(p, "w").write(ns)
              print(f"versionName -> {ver}")
          else:
              print("versionName line not found, skip")
          EOF

      - name: Assemble debug APK (always, installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify build contracts (offline payload parity + relative base)
        run: |
          set -e
          # 1) dist must use relative asset paths (APK WebView has no server root)
          test -f dist/index.html
          grep -q 'src="./assets/' dist/index.html || { echo "FAIL: dist assets not relative"; grep -o 'src="[^"]*"' dist/index.html | head -3; exit 1; }
          if grep -q 'src="/assets/' dist/index.html; then echo "FAIL: absolute /assets path leaked"; exit 1; fi
          # 2) full offline payload present in dist (counts are external anchors:
          #    derived from upstream git tree, not from the build itself)
          for spec in "atlas/img webp 7298" "atlas/thumb webp 7298" "atlas/audio mp3 22905" "atlas/entries json 73"; do
            set -- $spec
            N=$(find "dist/$1" -type f -name "*.$2" | wc -l)
            echo "dist/$1: $N *.$2"
            [ "$N" -eq "$3" ] || { echo "FAIL: dist/$1 expected $3 got $N"; exit 1; }
          done
          test -f dist/atlas/index.json
          # 3) cap sync must copy the payload into android assets 1:1
          A=$(find android/app/src/main/assets/public/atlas -type f | wc -l)
          D=$(find dist/atlas -type f | wc -l)
          echo "android assets: $A / dist: $D"
          [ "$A" -eq "$D" ] || { echo "FAIL: cap sync lost files"; exit 1; }
          # 4) APK must physically contain the payload
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          IN_APK=$(unzip -l "$APK" | grep -c 'public/atlas/' || true)
          echo "APK atlas entries: $IN_APK"
          [ "${IN_APK:-0}" -ge 37575 ] || { echo "FAIL: APK payload incomplete"; exit 1; }
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wordatlas-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Inject release signing (tag builds; skipped silently without secrets)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "keystore secrets not fully configured, skipping release signing (fallback to debug-signed APK)"
            exit 0
          fi
          python3 - <<'EOF'
          import base64, os
          raw = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"])
          open("android/app/wordatlas-release.jks", "wb").write(raw)
          def q(s):
              return s.replace("\\", "\\\\").replace("'", "\\'")
          ks = q(os.environ["KEYSTORE_PASSWORD"]); ka = q(os.environ["KEY_ALIAS"]); kp = q(os.environ["KEY_PASSWORD"])
          block = f"""
          android {{
              signingConfigs {{
                  release {{
                      storeFile file("wordatlas-release.jks")
                      storePassword '{ks}'
                      keyAlias '{ka}'
                      keyPassword '{kp}'
                  }}
              }}
              buildTypes {{
                  release {{
                      signingConfig signingConfigs.release
                  }}
              }}
          }}
          """
          open("android/app/build.gradle", "a").write(block)
          print("release signing injected")
          EOF

      - name: Assemble release APK (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Correctly signed release APK straight from Gradle?
          SIGNED_OK=0
          if [ -f android/app/build/outputs/apk/release/app-release.apk ] && [ -f android/app/wordatlas-release.jks ]; then
            if "$ANDROID_HOME/build-tools/"*/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk 2>/dev/null | grep -q "Signer #1"; then
              SIGNED_OK=1
            fi
          fi
          if [ "$SIGNED_OK" = "1" ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
            OUT="wordatlas-${TAG}.apk"
            NOTE="正式签名包，可直接安装。含全量离线词库（约 650MB）。"
          else
            # Fall back to the debug-signed APK so the Release stays installable.
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            OUT="wordatlas-${TAG}-debug.apk"
            NOTE="debug 签名包（可直接安装，先顶着）。要出正式签名：在仓库 Secrets 里加 ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 后重打 tag。"
          fi
          if [ ! -f "$APK" ]; then echo "APK missing: $APK"; ls -R android/app/build/outputs/apk || true; exit 1; fi
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          gh release create "$TAG" "$OUT" \
            --title "词光 $TAG" \
            --notes "词光 Word Atlas Android 版（fork 自 designfuchen/word-atlas，代码 MIT，词库/插画/录音 CC BY 4.0 署名 Word Atlas contributors）。

          $NOTE

          安装：下载 apk 后直接安装（需允许「安装未知应用」）。
          体积：约 650MB，全量 7298 词插画 + 英美发音 + 例句朗读，打包进本地，断网可刷。"

  # ==========================================================================
  # emulator-smoke —— API 34 模拟器冒烟：第一性原理验证「APK 能装能启动」
  # 四个机器可验证的事实：装得上(pm list) / 起得来(am start -W ok) /
  # 进程不死(pidof 连续30s) / 画面已合成(screencap 非空 PNG)。
  # 截图是弱断言（白屏也非空），artifact 里人工看一眼；白屏假绿风险已知。
  # ==========================================================================
  emulator-smoke:
    needs: build                    # 消费 build job 的 wordatlas-debug artifact
    runs-on: ubuntu-latest          # 托管 runner 自带 /dev/kvm
    timeout-minutes: 30
    strategy:
      fail-fast: false              # 一台挂别连坐，三台并行各出各的证据
      matrix:
        api-level: [28, 34, 35]     # 三代 Android 并发：旧机兼容 / 主流 / 最新
    steps:
      - name: KVM 健康检查（无硬件加速立即失败，不烧超时）
        run: |
          ls -l /dev/kvm || { echo "::error::/dev/kvm 不存在，无法硬件加速"; exit 1; }
          sudo chmod 666 /dev/kvm || {
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          }
          [ -w /dev/kvm ] || { echo "::error::/dev/kvm 仍不可写"; exit 1; }

      - name: Setup Java (sdkmanager/avdmanager 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 下载 APK artifact（wordatlas-debug）
        uses: actions/download-artifact@v4
        with:
          name: wordatlas-debug
          path: apk

      - name: 确认 APK 落盘（区分产物问题 vs 模拟器问题）
        run: ls -lh apk/app-debug.apk

      # ⚠️ android-emulator-runner 的 script: 是逐行 sh -c 执行的（变量/控制流不跨行），
      # 所以冒烟逻辑必须先落成文件，再用单行 bash smoke.sh 调用。
      - name: 生成冒烟脚本（单文件，绕开 action 逐行执行限制）
        run: |
          cat > smoke.sh <<'SMOKE_EOF'
          #!/usr/bin/env bash
          # 冒烟四锚点：装得上 / 起得来 / 进程不死 / 画面已合成。
          # 失败路径自管：先把证据落盘再退出（模拟器在 script 结束即被杀）。
          set +e
          PKG="com.xueweijian.wordatlas"
          ACT="com.xueweijian.wordatlas/.MainActivity"
          APK="apk/app-debug.apk"
          OUT="emulator-smoke"
          mkdir -p "$OUT"
          FAIL=""

          echo "== 锚点1「装得上」：adb install + 包列表核验 =="
          adb install -r -t -g "$APK"
          if ! adb shell pm list packages | grep -q "package:$PKG"; then
            echo "::error::安装后包列表里没有 $PKG（见上方 adb install 报错，如 NO_MATCHING_ABIS / 签名）"
            FAIL="install"
          fi

          echo "== 锚点2「起得来」：am start -W 等 Launcher 返回 =="
          start_out=$(adb shell am start -W -n "$ACT")
          echo "$start_out"
          echo "$start_out" | grep -q "Status: ok" || {
            echo "::error::am start 未返回 ok（Activity 不存在 / 被拒启）"
            FAIL="$FAIL am_start"
          }

          echo "== 锚点3「进程不死」：pidof 连续 30 秒非空（抓启动即崩）=="
          alive=0
          for i in $(seq 1 30); do
            pid=$(adb shell pidof "$PKG" | tr -d '\r')
            if [ -n "$pid" ]; then
              alive=$((alive+1)); sleep 1
            else
              echo "::error::进程在第 ${alive}s 后消失（启动即崩），见 logcat"
              FAIL="$FAIL process_died"
              break
            fi
          done
          echo "进程存活 ${alive}s / 要求 >= 30s"

          echo "== 锚点3.5「前台确实是词光」（缓解白屏假绿，warning 级）=="
          adb shell dumpsys window | grep -m1 mCurrentFocus || true
          adb shell dumpsys window | grep -m1 mCurrentFocus | grep -q "$PKG" \
            || echo "::warning::前台窗口不含 $PKG —— 可能白屏/被系统页覆盖，看截图 artifact"

          echo "== 采集证据（必须在模拟器活着时做：action 退出即杀模拟器）=="
          adb exec-out screencap -p > "$OUT/screen.png"   # exec-out 不做 \n→\r\n 转换，PNG 不坏
          adb logcat -d | tail -200 > "$OUT/logcat.txt"
          ls -l "$OUT"
          if [ ! -s "$OUT/screen.png" ]; then
            echo "::error::截图 0 字节：SurfaceFlinger 没有合成出任何画面"
            FAIL="$FAIL no_screen"
          elif [ "$(wc -c < "$OUT/screen.png")" -lt 10240 ]; then
            echo "::warning::截图 <10KB，疑似黑屏/纯色（弱断言，人工看 artifact）"
          fi

          if [ -n "$FAIL" ] || [ "$alive" -lt 30 ]; then
            echo "::error::冒烟失败，原因:[$FAIL] 存活:${alive}s"
            exit 1
          fi
          echo "== 冒烟通过：装得上 + 起得来 + 30s 进程不死 + 有合成画面 =="
          SMOKE_EOF
          bash -n smoke.sh && echo "smoke.sh syntax OK"

      - name: 启动模拟器并跑冒烟断言 (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64              # 必须匹配 x86 runner，arm64 镜像跑不起来
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash smoke.sh

      - name: 上传冒烟证据（截图 + logcat，无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-api${{ matrix.api-level }}
          path: emulator-smoke/
          if-no-files-found: warn
